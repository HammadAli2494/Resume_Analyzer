# Render.com — Django API + ML (pair with Netlify frontend)
# Dashboard: New > Blueprint > connect repo, or create Web Service manually.

services:
  - type: web
    name: resume-screening-api
    runtime: python
    rootDir: backend
    buildCommand: chmod +x build.sh && ./build.sh
    startCommand: gunicorn resume_screening.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: DJANGO_PRODUCTION
        value: "1"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: resume-screening-db
          property: connectionString

databases:
  - name: resume-screening-db
    plan: free
    databaseName: resume_screening
    user: resume_screening
